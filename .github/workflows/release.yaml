name: Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Check whether the pom version has a GitHub Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pom_version="$(mvn -q -B help:evaluate \
            -Dexpression=project.version -DforceStdout)"
          tag="v${pom_version}"
          echo "pom_version=$pom_version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$tag")"
          case "$status" in
            200)
              echo "release_exists=true" >>"$GITHUB_OUTPUT"
              echo "::notice::GitHub Release $tag already exists; nothing to release."
              ;;
            404)
              echo "release_exists=false" >>"$GITHUB_OUTPUT"
              echo "::notice::Releasing $tag."
              ;;
            *)
              echo "::error::Unexpected GitHub API status $status while checking release $tag."
              exit 1
              ;;
          esac

      - name: Build
        if: steps.version.outputs.release_exists == 'false'
        env:
          POM_VERSION: ${{ steps.version.outputs.pom_version }}
        run: |
          mvn -B clean package
          test -f "target/keycloak-login-sync-provider-${POM_VERSION}.jar"

      - name: Generate GitHub App token
        if: steps.version.outputs.release_exists == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag the release
        if: steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")"
          case "$status" in
            200)
              echo "::notice::Tag $TAG already exists; retaining it."
              ;;
            404)
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" \
                -f sha="$(git rev-parse HEAD)"
              ;;
            *)
              echo "::error::Unexpected GitHub API status $status while checking tag $TAG."
              exit 1
              ;;
          esac

      - name: Create GitHub release
        if: steps.version.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ steps.generate-token.outputs.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: target/keycloak-login-sync-provider-${{ steps.version.outputs.pom_version }}.jar
