# This stack carries CONFIGURATION ONLY and MUST NOT provision realms, clients or roles.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SERVICE_ENDPOINT: ${KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SERVICE_ENDPOINT}
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_CLIENT_ID: ${KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_CLIENT_ID}
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_CLIENT_SECRET: ${KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_CLIENT_SECRET}
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_TOKEN_ENDPOINT: ${KC_SPI_AUTHENTICATOR__LOGIN_SYNC__SA_TOKEN_ENDPOINT}
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__HTTP_TIMEOUT_MS: ${KC_SPI_AUTHENTICATOR__LOGIN_SYNC__HTTP_TIMEOUT_MS}
      KC_SPI_AUTHENTICATOR__LOGIN_SYNC__ALLOW_INSECURE_HTTP: ${KC_SPI_AUTHENTICATOR__LOGIN_SYNC__ALLOW_INSECURE_HTTP:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./target:/opt/keycloak/providers:z

  mock-syncservice:
    image: docker.io/library/eclipse-temurin:27-jre@sha256:d6bfa738df69e8dec9061b3e26f2ae564d92ad169faa36086dcfa33f0a901d35
    command:
      - java
      - -cp
      - /opt/mock/test-classes
      - com.wuerthit.keycloak.authenticators.loginsync.support.MockSyncService
    environment:
      MOCK_PORT: ${MOCK_PORT}
    ports:
      - "${MOCK_PORT}:${MOCK_PORT}"
    volumes:
      - ./target/test-classes:/opt/mock/test-classes:ro,z
